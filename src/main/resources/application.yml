server:
  port: ${PORT:8080}
  servlet:
    context-path: /shortly

spring:
  application:
    name: shortly

  mongodb:
    uri: ${MONGO_URL}

  jackson:
    mapper:
      accept-case-insensitive-enums: true
    deserialization:
      # Jackson 3 (Spring Boot 4) rejects a missing/null value for a primitive field; request bodies
      # here omit optional numbers and flags, so treat them as 0/false as Jackson 2 did.
      fail-on-null-for-primitives: false

app:
  # Frontend address used in email and SMS links (verify-email, /receive). Set per environment;
  # falls back to FRONTEND_HOST (the CORS origin) when not set.
  frontend-base-url: ${APP_FRONTEND_URL:${FRONTEND_HOST:http://localhost:3000}}
  email-verification-path: ${EMAIL_VERIFICATION_PATH:/verify-email}
  mail-from: ${MAIL_FROM:no-reply@shortly.com}
  email-verification-expiry-ms: ${EMAIL_VERIFICATION_EXPIRY_MS:86400000}

mailtrap:
  api-url: ${MAILTRAP_API_URL:https://send.api.mailtrap.io/api/send}
  token: ${MAILTRAP_API_TOKEN}
  from-name: ${MAILTRAP_FROM_NAME:Shortly}



mnotify:
  accessKey: ${MNOTIFY_API}
  sender: Synergetics
  baseUrl: https://api.mnotify.com/api/sms

frontend-server:
  baseUrl: ${FRONTEND_HOST}
  

jwt:
  secretKey: ${JWT_ACCESS_KEY}
  refreshKey: ${JWT_REFERESH_KEY}
  expirationTime: ${JWT_EXPIRATIONTIME}

springdoc:
  dev-url: https://backend.mandmservicescorp.org/shortly

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket: ${R2_BUCKET:mnm-parcel-images}
  public-base-url: ${R2_PUBLIC_BASE_URL}

jimi:
  appKey: ${JIMI_APP_KEY}
  appSecret: ${JIMI_APP_SECRET}
  baseUrl: ${JIMI_BASE_URL:https://open.tracksolidpro.com/route/rest}
  userId: ${JIMI_USER_ID}
  userPasswordMd5: ${JIMI_USER_PASSWORD_MD5}

shortly:
  google:
    # Google Routes API key for road distances (delivery pricing). Empty = straight line x 1.35.
    maps-api-key: ${GOOGLE_MAPS_API_KEY:}
  paystack:
    # Secret key used to verify customer delivery payments.
    secret-key: ${PAYSTACK_SECRET_KEY:}
  sms:
    # Text receivers a "parcel arrived" SMS with the /receive link (costs an SMS per parcel).
    receiver-arrival-enabled: ${RECEIVER_ARRIVAL_SMS:false}

