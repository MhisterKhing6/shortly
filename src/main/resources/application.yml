server:
  port: ${PORT:8080}
  servlet:
    context-path: /shortly

spring:
  application:
    name: shortly

  mongodb:
    uri: ${MONGO_URL}

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: ${MAIL_HOST:smtp.gmail.com}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend-base-url: ${FRONTEND_HOST:http://localhost:3000}
  email-verification-path: ${EMAIL_VERIFICATION_PATH:/verify-email}
  mail-from: ${MAIL_FROM:no-reply@shortly.com}
  email-verification-expiry-ms: ${EMAIL_VERIFICATION_EXPIRY_MS:86400000}



mnotify:
  accessKey: ${MNOTIFY_API}
  sender: Synergetics
  baseUrl: https://api.mnotify.com/api/sms

frontend-server:
  baseUrl: ${FRONTEND_HOST}
  

jwt:
  secretKey: ${JWT_ACCESS_KEY}
  refreshKey: ${JWT_REFERESH_KEY}
  expirationTime: ${JWT_EXPIRATIONTIME}

springdoc:
  dev-url: https://backend.mandmservicescorp.org/shortly

aws:
  accessKey: ${AWS_ACCESS_KEY:not-configured}
  secretKey: ${AWS_SECRET_KEY:not-configured}
  s3:
    bucket: ${AWS_S3_BUCKET:mnm-parcel-images}
    region: ${AWS_S3_REGION:eu-north-1}

jimi:
  appKey: ${JIMI_APP_KEY}
  appSecret: ${JIMI_APP_SECRET}
  baseUrl: ${JIMI_BASE_URL:https://open.tracksolidpro.com/route/rest}
  userId: ${JIMI_USER_ID}
  userPasswordMd5: ${JIMI_USER_PASSWORD_MD5}

